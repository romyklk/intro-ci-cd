name: Needs et Outputs
on:
    push:
        branches:
            - main
            - develop
            - feature/*
    pull_request:
        branches:
            - main
jobs:
    code-quality:
        runs-on: ubuntu-latest
        outputs:
          quality-code-version: ${{ steps.quality-code-version.outputs.quality-code-version }}
        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@v7
            - name: Vérifier la qualité du code
              run: echo "Vérification de la qualité du code..."
            - name: Quality code version
              id: quality-code-version
              run: echo "quality-code-version=1.0" >> $GITHUB_OUTPUT
            - name: Linting du code
              run: echo "Linting du code..."
            - name: Afficher la version de la qualité du code
              run: echo La version de la qualité du code ${{ steps.quality-code-version.outputs.quality-code-version }}

    static-analysis:
        runs-on: ubuntu-latest
        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@v7
            - name: Analyse statique du code
              run: echo "Analyse statique du code..."

    test:
        needs: [code-quality, static-analysis]
        runs-on: ubuntu-latest
        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@v7
            - name: Exécuter les tests
              run: echo "Exécution des tests..."
            - name: Afficher la version de la qualité du code
              run: echo La version de la qualité du code ${{ needs.code-quality.outputs.quality-code-version }}

    build:
        needs: [test]
        runs-on: ubuntu-latest
        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@v7
            - name: Construire le projet
              run: echo "Construction du projet..."